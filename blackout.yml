# This is the nebula example configuration file. You must edit, at a minimum, the static_host_map, lighthouse, and firewall sections
# Some options in this file are HUPable, including the pki section. (A HUP will reload credentials from disk without affecting existing tunnels)
# PKI defines the location of credentials for this node. Each of these can also be inlined by using the yaml ": |" syntax.
pki:
  ca: /etc/nebula/ca.crt
  cert: /etc/nebula/blackout.crt
  key: /etc/nebula/blackout.key
static_host_map:
  "10.99.0.77": ["150.136.33.18:4242"]
lighthouse:
  am_lighthouse: false
  interval: 60
  hosts:
    - "10.99.0.77"
listen:
  host: "0.0.0.0"
  port: 4242
punchy:
  punch: true
  respond: true
  delay: 1s
relay:
  am_relay: false
  use_relays: false
tun:
  disabled: false
  dev: megaport
  drop_local_broadcast: false
  drop_multicast: false
  tx_queue: 500
  mtu: 1300
  routes:
logging:
  level: info
  format: text
firewall:
  outbound_action: drop
  inbound_action: drop
  conntrack:
    tcp_timeout: 12m
    udp_timeout: 3m
    default_timeout: 10m
  outbound:
    # Allow TO other hosts
    - port: any
      proto: any
      host: any
  inbound:
    # Allow FROM this node
    - port: any
      proto: icmp
      host: any
    # Allow ssh from admins
    - port: 22
      proto: tcp
      groups: admin
